services:
  # ── Backend (FastAPI on Render) ──────────────────────────────────────────────
  - type: web
    name: travelpilot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Paste your Neon connection string here (or set it in the Render dashboard)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set to your Vercel frontend URL after deploying, e.g. https://travelpilot.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional — set to enable live LLM responses (leave blank for demo/offline mode)
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
