databases:
  - name: travelpilot-db
    databaseName: travelpilot
    user: postgres
    plan: free

services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  - type: web
    name: travelpilot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: travelpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: LLM_API_KEY
        value: ""
      - key: LLM_BASE_URL
        value: ""
      - key: LLM_MODEL
        value: ""
    healthCheckPath: /

  # ── Frontend (React + Vite static site) ─────────────────────────────────────
  - type: static
    name: travelpilot-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
